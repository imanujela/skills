# Agent interface config for the 'Grill with Docs' skill.
# Purpose: declares how this skill appears to the model/agent runtime
#   interface.display_name      -> human-facing name shown in skill listings
#   interface.short_description -> one-line pitch shown next to the name
#   policy.allow_implicit_invocation -> false = the model may not auto-trigger
#        this skill; it must be invoked explicitly by the user (a slash-style skill).
# Conventions: keep display_name human, short_description under ~50 chars,
# and never set allow_implicit_invocation to true unless the skill is safe to
# fire on its own (side-effect-free and cheap to run).
interface:
  display_name: "Grill with Docs"
  short_description: "Grill a design and write its docs"
policy:
  allow_implicit_invocation: false
